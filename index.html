    <!-- Browser extension fetch setter guard: prevents TypeError when extensions attempt to monkey-patch window.fetch -->
    <script>
      (function() {
        try {
          var _rawFetch = window.fetch;
          var _currentFetch = function() {
            return _rawFetch.apply(window, arguments);
          };

          // Guard on Window.prototype if accessible
          if (typeof Window !== 'undefined' && Window.prototype) {
            try {
              var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
              if (!protoDesc || !protoDesc.set) {
                Object.defineProperty(Window.prototype, 'fetch', {
                  get: function() { return _currentFetch; },
                  set: function(fn) { _currentFetch = fn; },
                  configurable: true,
                  enumerable: true
                });
              }
            } catch (e) {}
          }

          // Guard directly on window object
          Object.defineProperty(window, 'fetch', {
            get: function() { return _currentFetch; },
            set: function(fn) { _currentFetch = fn; },
            configurable: true,
            enumerable: true
          });
        } catch (err) {}
      })();
    </script>
